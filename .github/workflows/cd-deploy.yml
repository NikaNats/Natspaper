name: Production Deployment

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

# Only ORG_ID and PROJECT_ID at workflow level (non-secret)
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ── Gate 1: static checks, unit tests (coverage-enforced), audit, build ──
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm version is read from the `packageManager` field in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm security:audit

      - name: Type check
        run: pnpm astro check

      - name: Lint & Format
        run: |
          pnpm run lint
          pnpm run format:check

      - name: Unit tests (coverage thresholds enforced)
        run: pnpm test:coverage

      - name: Component tests (Astro Container API)
        run: pnpm test:component

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Production build
        run: pnpm run build:prod
        env:
          SITE_WEBSITE: https://natspaper.vercel.app

      # `vercel build` reads vercel.json (headers incl. CSP) when it starts,
      # but the build regenerates the CSP hashes at the end. A stale committed
      # vercel.json would therefore ship old hashes and block inline scripts
      # in production. Refuse to deploy unless the committed file is current.
      - name: Verify CSP hashes are fresh
        run: |
          git diff --exit-code -- vercel.json || {
            echo "::error::vercel.json is stale: committed CSP hashes do not match this build. Run 'pnpm run build:prod' locally and commit vercel.json."
            exit 1
          }

  # ── Deploy: only after every gate is green ──
  deploy:
    name: Deploy to Production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://natspaper.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm version is read from the `packageManager` field in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      # Belt and braces for the CSP gate in `verify`: if this build produced
      # different hashes than the vercel.json it started with, the prebuilt
      # output carries stale headers. Never deploy that.
      - name: Assert build did not change vercel.json
        run: |
          git diff --exit-code -- vercel.json || {
            echo "::error::vercel build regenerated CSP hashes; the prebuilt output would ship stale headers."
            exit 1
          }

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Verify deployment
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=5

          check_url() {
            local url="$1"
            for i in $(seq 1 $MAX_RETRIES); do
              status=$(curl -s -L -w "%{http_code}" -o /dev/null --max-time 15 "$url")
              if [ "$status" = "200" ]; then
                echo "✅ $url"
                return 0
              fi
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            done
            echo "❌ $url ($status)"
            return 1
          }

          FAILED=0
          BASE="https://natspaper.vercel.app"

          for page in /en/ /en/posts /en/tags /en/archives \
                      /ka/ /ka/posts /ka/tags \
                      /api/health.json /sitemap-index.xml \
                      /en/rss.xml /robots.txt; do
            check_url "$BASE$page" || FAILED=1
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "🎉 All deployment checks passed successfully!"
          exit 0

      - name: Rollback on failure
        if: failure() && steps.deploy.outputs.url != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "🔄 Rolling back..."
          vercel rollback --yes --token=$VERCEL_TOKEN

      - name: Deployment summary
        if: always()
        run: |
          echo "### 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deploy.outputs.url || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

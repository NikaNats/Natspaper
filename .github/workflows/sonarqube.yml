name: SonarQube Cloud Analysis

env:
  NODE_VERSION: "24"
  # pnpm version is NOT pinned here - pnpm/action-setup reads it from
  # the `packageManager` field in package.json (single source of truth).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - main
      - develop

# Cancel previous runs for same PR
concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube-scan:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Required for SonarQube to analyze history

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run Tests with Coverage
        run: pnpm run test:coverage
        continue-on-error: true # Coverage generation shouldn't block scanning

      - name: Verify Coverage Report
        run: |
          if [ -f "coverage/lcov.info" ]; then
            echo "✅ Coverage report generated successfully"
            wc -l coverage/lcov.info
          else
            echo "⚠️ Warning: Coverage report not found"
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        continue-on-error: true # Don't fail CI if quality gate fails (informational)

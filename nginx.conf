# nginx.conf

# ==============================================================================
# HTTP (Port 80): RFC 6797 Section 7.2 Server Processing Model
# Plain HTTP MUST redirect to HTTPS without emitting STS header
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Permanent 301 redirect to HTTPS (RFC 6797 Section 7.2)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# HTTPS (Port 443): RFC 6797 HSTS Enabled Server
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # TLS Certificates (Configure your mount or certbot path)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # RFC 6797 Strict Transport Security Header
    # 2 years = 63072000 seconds, with subdomains and preload eligibility
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Auxiliary Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Caching and Static Assets (RFC 9111) + Compression
    etag on;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # RFC 8878 Zstandard negotiation (serve .zst when Accept-Encoding: zstd)
    set $zstd_ext "";
    set $content_encoding "";
    if ($http_accept_encoding ~* "zstd") {
        set $zstd_ext ".zst";
        set $content_encoding "zstd";
    }

    # Tier 1: Immutable Static Fingerprinted Assets
    location ~* ^/(_astro|assets|fonts|styles)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # Serve pre-compressed .zst if client supports it and file exists
        if (-f $request_filename$zstd_ext) {
            add_header Content-Encoding $content_encoding always;
            rewrite (.*) $1$zstd_ext break;
        }
        access_log off;
    }

    # Tier 3: Discovery & Syndication Feeds
    location ~* \.(xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, s-maxage=86400, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Tier 4: Healthcheck API
    location = /api/health.json {
        expires 1m;
        add_header Cache-Control "public, max-age=60, s-maxage=60, no-transform" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Tier 2: HTML Documents & Default Routes
    location / {
        try_files $uri $uri/ $uri.html /404.html;
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate, s-maxage=86400, stale-while-revalidate=3600" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    error_page 404 /404.html;
}

# nginx.conf
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable ETags (RFC 9111 Section 4.3.1)
    etag on;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Tier 1: Immutable Static Fingerprinted Assets
    location ~* ^/(_astro|assets|fonts|styles)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Tier 3: Discovery & Syndication Feeds
    location ~* \.(xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, s-maxage=86400, stale-while-revalidate=86400";
    }

    # Tier 4: Healthcheck API
    location = /api/health.json {
        expires 1m;
        add_header Cache-Control "public, max-age=60, s-maxage=60, no-transform";
    }

    # Tier 2: HTML Documents & Default Routes
    location / {
        try_files $uri $uri/ $uri.html /404.html;
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate, s-maxage=86400, stale-while-revalidate=3600";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
}

allowBuilds:
  esbuild: true
  sharp: true
  zstandard: true

overrides:
  rollup: ">=4.59.0"
  h3: ">=1.15.6"
  svgo: ">=4.1.0"
  js-yaml: "4.3.2"
  fflate: ">=0.7.5"
  fast-xml-parser: ">=5.10.1"
  tar: ">=7.5.19"
  minimatch: ">=10.2.3"
  flatted: ">=3.4.2"
  "picomatch@<2.3.2": "2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "4.0.4"
  # Patch the ReDoS (CVE-2024-45296) without jumping majors: v8 rejects the
  # `(.*)` source patterns @vercel/routing-utils validates against.
  "path-to-regexp@<6.3.0": "6.3.0"
  brace-expansion: ">=5.0.8"
  fast-uri: ">=4.1.3"
  postcss: ">=8.5.18"
  sharp: ">=0.35.4"
  yaml: ">=2.8.3"
  # GHSA-238p-pmpm-9mq7: remark-math/rehype-katex pull katex 0.16.x; force the patched line.
  katex: ">=0.18.2"
  # GHSA-rj75-hqrm-r3gf: @tailwindcss/typography pins 6.0.10 (dev only).
  "postcss-selector-parser@<6.1.5": "6.1.5"
  # GHSA-3g3m-2fjr-6pw4: @vercel/nft pulls glob 13.x; patched in >=14.0.2.
  "glob@>=9.0.0 <14.0.2": ">=14.0.2"
  # Keep the WASI runtime pair on the stable line; @napi-rs/wasm-runtime
  # otherwise resolves an @emnapi/runtime 2.x beta that is ABI-incompatible
  # with @emnapi/core 1.x and crashes `astro check`.
  "@emnapi/core": "^1.11.3"
  "@emnapi/runtime": "^1.11.3"

minimumReleaseAge: 1440
